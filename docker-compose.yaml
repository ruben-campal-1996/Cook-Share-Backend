services:
  postgres:
    image: postgres:18
    container_name: cookandshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cookandshare
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cookandshare-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cookandshare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cookandshare-pgdata: